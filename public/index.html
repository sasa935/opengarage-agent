<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenGarage Agent</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="workspace" aria-label="OpenGarage diagnostic workspace">
        <form id="diagnose-form" class="input-panel">
          <div class="brand-row">
            <div class="mark" aria-hidden="true">
              <svg viewBox="0 0 48 48" role="img">
                <path d="M8 30h4l3-8c.8-2.2 2.6-3.5 5-3.5h8c2.4 0 4.2 1.3 5 3.5l3 8h4v8h-5.5a4.5 4.5 0 0 1-9 0h-9a4.5 4.5 0 0 1-9 0H8v-8Z" />
                <path d="M17.2 27h13.6l-1.6-4.2c-.3-.8-1-1.3-1.9-1.3h-6.6c-.9 0-1.6.5-1.9 1.3L17.2 27Z" />
              </svg>
            </div>
            <div>
              <h1>OpenGarage Agent</h1>
              <p>Evidence-first vehicle diagnostics</p>
            </div>
          </div>

          <div class="field-grid">
            <label>
              <span>VIN</span>
              <input name="vin" autocomplete="off" placeholder="optional" />
            </label>
            <label>
              <span>Year</span>
              <input name="year" inputmode="numeric" placeholder="2012" />
            </label>
            <label>
              <span>Make</span>
              <input name="make" placeholder="Honda" value="Honda" />
            </label>
            <label>
              <span>Model</span>
              <input name="model" placeholder="Accord" value="Accord" />
            </label>
            <label>
              <span>Mileage</span>
              <input name="mileage" inputmode="numeric" placeholder="120000" value="120000" />
            </label>
            <label>
              <span>DTCs</span>
              <input name="dtcs" placeholder="P0420, P0171" value="P0420, P0171" />
            </label>
          </div>

          <label class="wide">
            <span>Symptoms</span>
            <textarea name="symptoms" rows="4">rough idle
higher fuel consumption
check engine light on</textarea>
          </label>

          <div class="toggles">
            <label class="toggle">
              <input name="includeNetworkEvidence" type="checkbox" />
              <span>NHTSA lookup</span>
            </label>
            <label class="toggle">
              <input name="ai" type="checkbox" />
              <span>AI review</span>
            </label>
          </div>

          <p class="notice">AI review sends report data to the configured model provider.</p>

          <button type="submit" id="run-button">
            <span class="button-icon" aria-hidden="true">▶</span>
            Run diagnosis
          </button>
        </form>

        <section class="result-panel" aria-live="polite">
          <div class="result-head">
            <div>
              <h2>Diagnostic Report</h2>
              <p id="status">Ready</p>
            </div>
            <div class="status-pill" id="risk-pill">Idle</div>
          </div>

          <div id="summary" class="summary-grid"></div>
          <pre id="report" class="report-output">Fill the form and run a diagnosis.</pre>
        </section>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
